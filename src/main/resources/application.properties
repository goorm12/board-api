# Spring Boot 애플리케이션의 이름입니다.
spring.application.name=board

# 내장 웹 서버가 사용할 포트입니다.
# 애플리케이션 실행 후 localhost:8080으로 접속할 수 있습니다.
server.port=8080

# PostgreSQL 접속 주소입니다.
# localhost의 5432 포트에서 postgres 데이터베이스에 접속합니다.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

# PostgreSQL 접속 계정입니다.
spring.datasource.username=postgres

# DB_PASSWORD 환경변수에 저장된 비밀번호를 사용합니다.
# 실제 비밀번호를 이 파일에 직접 작성하지 않습니다.
spring.datasource.password=${DB_PASSWORD}

# 엔티티 구조를 기준으로 데이터베이스 테이블을 자동 갱신합니다.
# 개발 중에는 편리하지만 운영 환경에서는 사용에 주의해야 합니다.
spring.jpa.hibernate.ddl-auto=update

# Hibernate가 실행하는 SQL을 콘솔에 출력합니다.
spring.jpa.show-sql=true

# 출력되는 SQL을 읽기 좋은 형태로 정렬합니다.
spring.jpa.properties.hibernate.format_sql=true

# 웹 요청이 끝날 때까지 영속성 컨텍스트를 유지하는 OSIV 기능을 끕니다.
# 필요한 연관 데이터는 서비스 계층의 트랜잭션 안에서 조회해야 합니다.
spring.jpa.open-in-view=false
